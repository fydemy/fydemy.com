# Dokploy "Docker Compose" service type. Deployed with `docker compose up`, so
# build:, depends_on: and restart: are all honoured as written.
#
# If you ever switch this project to Dokploy's Swarm/stack mode, this file needs
# restructuring, not just a flag: `docker stack deploy` silently ignores build:,
# depends_on: and restart:, and you would need a prebuilt image in a registry
# plus a deploy: block instead.

services:
  fdm:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined at build time, so they MUST be build args.
      # In the Dokploy UI these belong in "Build Arguments", not "Environment".
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        # Not a NEXT_PUBLIC_ var, but still required at build time: robots.txt,
        # sitemap.xml, metadataBase and og:url are all prerendered from
        # siteConfig.url, which reads this. Runtime-only leaves them pointing at
        # localhost:3000. Set it in BOTH places (see environment: below).
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}

    restart: unless-stopped

    # PID 1 reaper. Without it `node server.js` is PID 1 and container stop
    # falls back to SIGKILL after the grace period instead of a clean shutdown.
    init: true

    # `expose`, never `ports`. Traefik terminates TLS and reaches this container
    # over dokploy-network, so publishing a host port would only put an
    # unauthenticated origin on the public interface, bypassing the proxy.
    expose:
      - "3000"

    # Deliberately NO traefik.* labels. Dokploy generates and reconciles the
    # router, service and certresolver labels from its Domains UI; anything
    # hand-written here is clobbered on the next redeploy.
    #
    # Two networks, two jobs — see the `networks:` block at the bottom for why.
    # dokploy-network is INGRESS ONLY (Traefik -> here). fydemy-internal is
    # EAST-WEST ONLY (this app <-> discord-bot-gateway). Never reach a Fydemy
    # sibling over dokploy-network; that is the coupling this split removes.
    #
    # Compose already aliases a service by its own name on every network it
    # joins, so the alias below is redundant today. It is written out anyway:
    # fydemy-internal is shared with other compose projects, and `fdm` is the
    # hostname the gateway's FDM_BASE_URL hardcodes. Spelling it here makes it
    # a declared contract rather than a side effect of the service key.
    networks:
      dokploy-network: {}
      fydemy-internal:
        aliases:
          - fdm

    environment:
      NODE_ENV: production

      # Runtime queries go through the pg driver adapter (src/lib/prisma.ts)
      # using DATABASE_URL. Migrations and the Prisma CLI read DIRECT_URL via
      # prisma.config.ts — point that at the unpooled endpoint.
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}

      # Must stay byte-identical to the Vercel value, or every active session
      # and every outstanding community-claim link is invalidated.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Public origin, no trailing slash. Also feeds siteConfig.url, so a wrong
      # value makes reminder emails link to localhost.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # OAuth only; the bot token and guild id moved to discord-bot-gateway.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}

      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_CC_EMAIL: ${RESEND_CC_EMAIL:-}

      # Server-side only — never expose the service role key to the client.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Also needed at runtime for publicObjectUrl(); the build arg above is
      # what puts it in the browser bundle.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}

      # Shared both directions with the gateway; must match byte for byte.
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      # Service name on fydemy-internal; the gateway has no public hostname.
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://gateway:8080}

    healthcheck:
      # /robots.txt is generated by src/app/robots.ts and served statically, so
      # this stays green even when the database is unreachable — it reports
      # "process is up", not "dependencies are healthy". That is what you want
      # for a restart policy; a DB blip should not restart-loop the app.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cold Next.js start plus first-request compile; below ~20s the container
      # gets marked unhealthy before it has finished booting.
      start_period: 20s

networks:
  # INGRESS ONLY. Created and owned by Dokploy. `external: true` means compose
  # attaches to it and never tries to create or remove it — this must already
  # exist on the host, which it does on any Dokploy node.
  #
  # Every Dokploy app on the node shares this bridge, so any container on it can
  # already reach fdm:3000 directly and skip the proxy. That is tolerable for
  # the app (Traefik has to get in somehow) but not for the rest of the stack,
  # which is why service-to-service traffic moved off it.
  dokploy-network:
    external: true

  # EAST-WEST ONLY. Private bridge for Fydemy services talking to each other:
  # fdm <-> discord-bot-gateway. The gateway attaches to THIS AND NOTHING ELSE —
  # no dokploy-network, no domain, no Traefik router — so it is unreachable from
  # every other app on the node while still getting NAT egress to discord.com.
  #
  # `external: true` is forced, not stylistic: fdm and the gateway are separate
  # Dokploy applications, hence separate compose projects, and a project-scoped
  # network cannot be shared across them. Create it once per host, by hand:
  #
  #   docker network create fydemy-internal
  #
  # It is not managed by Dokploy, so nothing recreates it for you. `docker
  # network prune` WILL delete it whenever no container is attached — after a
  # full stack teardown, recreate it before bringing services back up.
  fydemy-internal:
    external: true

# The reminder bot lives in discord-bot-gateway with an embedded scheduler.
# Trigger a run by hand from inside fydemy-internal:
#   docker compose exec fdm wget -qO- \
#     --header="Authorization: Bearer $GATEWAY_TOKEN" \
#     "http://gateway:8080/runs?dryRun=1"
